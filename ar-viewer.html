<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>testt</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{overflow:hidden;background:#000;font-family:Arial,sans-serif;}
    #ar-container{width:100vw;height:100vh;position:relative;}
    #loading{position:fixed;inset:0;background:rgba(0,0,0,0.93);display:flex;flex-direction:column;
      align-items:center;justify-content:center;z-index:9999;color:#fff;gap:18px;transition:opacity 0.5s;}
    .ring{width:56px;height:56px;border:4px solid rgba(124,111,255,0.25);border-top-color:#7c6fff;
      border-radius:50%;animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .load-title{font-size:1.2rem;font-weight:bold;}
    .load-sub{font-size:0.82rem;opacity:0.6;max-width:250px;text-align:center;line-height:1.5;}
    #hint{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
      background:rgba(0,0,0,0.72);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);
      border-radius:100px;padding:9px 20px;color:#fff;font-size:0.83rem;z-index:100;
      animation:pulse 2s ease-in-out infinite;white-space:nowrap;}
    @keyframes pulse{0%,100%{opacity:0.7;}50%{opacity:1;}}
    #found{position:fixed;top:18px;left:50%;transform:translateX(-50%);
      background:rgba(77,255,170,0.9);color:#000;padding:7px 20px;border-radius:100px;
      font-size:0.83rem;font-weight:bold;z-index:100;opacity:0;transition:opacity 0.3s;white-space:nowrap;}
    #found.on{opacity:1;}
  </style>
</head>
<body>
<div id="loading">
  <div class="ring"></div>
  <div class="load-title">⬡ AR Başlatılıyor</div>
  <div class="load-sub">Kamera erişimi isteniyor…</div>
</div>
<div id="found">✓ Marker Bulundu!</div>
<div id="hint">📷 Kamerayı marker görseline doğrult</div>
<div id="ar-container"></div>

<script>
(async () => {
  const mindarThree = new window.MINDAR.IMAGE.MindARThree({
    container: document.getElementById('ar-container'),
    imageTargetSrc: 'Ekran görüntüsü 2026-06-02 140814.mind',
    maxTrack: 1,
    uiLoading: 'no',
    uiScanning: 'no',
    uiError: 'no',
  });

  const { renderer, scene, camera } = mindarThree;
  const anchor = mindarThree.addAnchor(0);

  // Lighting
  const ambLight = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  // Load GLTF/GLB model
  const loader = new THREE.GLTFLoader();
  let mixer = null;
  loader.load('3SHAFA.gltf', (gltf) => {
    const model = gltf.scene;
    model.scale.set(0.3, 0.3, 0.3);
    model.position.set(0, 0, 0);
    anchor.group.add(model);

    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);
      gltf.animations.forEach(clip => {
        const action = mixer.clipAction(clip);
        action.play();
      });
    }
  }, undefined, (err) => console.error('Model yüklenemedi:', err));

  // Marker events
  anchor.onTargetFound = () => {
    document.getElementById('found').classList.add('on');
    document.getElementById('hint').textContent = '✓ Model görüntüleniyor';
    setTimeout(() => document.getElementById('found').classList.remove('on'), 2000);
  };
  anchor.onTargetLost = () => {
    document.getElementById('hint').textContent = '📷 Kamerayı marker görseline doğrult';
  };

  // Start AR
  await mindarThree.start();
  document.getElementById('loading').style.opacity = '0';
  setTimeout(() => document.getElementById('loading').style.display = 'none', 500);

  // Render loop
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    if (mixer) mixer.update(clock.getDelta());
    renderer.render(scene, camera);
  });
})();
</script>
</body>
</html>
